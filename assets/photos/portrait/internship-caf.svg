<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">工程决策辅助工作台概念图</title>
  <desc id="desc">以抽象数据、模型节点和决策面板表现工程管理研究，不包含真实项目数据。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#193b45"/>
      <stop offset="1" stop-color="#102831"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3b96a"/>
      <stop offset="1" stop-color="#bc7e42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#081a21" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#d9e7e3" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#grid)"/>
  <circle cx="1040" cy="100" r="260" fill="#d7a659" opacity=".08"/>
  <circle cx="110" cy="820" r="310" fill="#7ba6a5" opacity=".08"/>

  <g transform="translate(78 68)">
    <text x="0" y="18" fill="#f7efdf" font-family="Arial, sans-serif" font-size="18" letter-spacing="5">ENGINEERING DECISION LAB</text>
    <text x="0" y="58" fill="#91aaa9" font-family="Arial, sans-serif" font-size="13" letter-spacing="3">MODEL  →  SIGNAL  →  DECISION</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="78" y="168" width="738" height="588" rx="28" fill="#f8f2e7"/>
    <rect x="102" y="194" width="690" height="52" rx="14" fill="#e7e1d6"/>
    <circle cx="130" cy="220" r="7" fill="#bc7e42"/>
    <circle cx="154" cy="220" r="7" fill="#789998"/>
    <circle cx="178" cy="220" r="7" fill="#c7c0b4"/>
    <text x="218" y="226" fill="#3f555d" font-family="Arial, sans-serif" font-size="15" letter-spacing="2">PREDICTION WORKBENCH</text>

    <rect x="104" y="270" width="424" height="274" rx="18" fill="#fffdf8" stroke="#ded6c8"/>
    <text x="130" y="306" fill="#314850" font-family="Arial, sans-serif" font-size="15" font-weight="700">ENSEMBLE SIGNAL</text>
    <text x="464" y="306" text-anchor="end" fill="#8e9d9d" font-family="Arial, sans-serif" font-size="12">CONFIDENCE 84%</text>
    <path d="M132 482C178 448 201 464 245 414S330 456 376 370 441 396 500 322" fill="none" stroke="url(#gold)" stroke-width="8" stroke-linecap="round"/>
    <path d="M132 470C184 474 214 438 260 448S344 406 390 428 450 380 500 390" fill="none" stroke="#6f9595" stroke-width="4" stroke-linecap="round" opacity=".75"/>
    <g fill="#bc7e42">
      <circle cx="245" cy="414" r="7"/><circle cx="376" cy="370" r="7"/><circle cx="500" cy="322" r="7"/>
    </g>
    <path d="M132 504H500" stroke="#ddd5c7"/><path d="M132 338H500" stroke="#ddd5c7" stroke-dasharray="6 8"/>

    <rect x="552" y="270" width="240" height="274" rx="18" fill="#214650"/>
    <text x="578" y="306" fill="#dce8e4" font-family="Arial, sans-serif" font-size="14" font-weight="700">MODEL MIX</text>
    <g font-family="Arial, sans-serif" font-size="12">
      <text x="578" y="354" fill="#b9cbca">TREE MODEL</text><text x="754" y="354" text-anchor="end" fill="#f0c77f">42%</text>
      <rect x="578" y="367" width="176" height="8" rx="4" fill="#17343d"/><rect x="578" y="367" width="74" height="8" rx="4" fill="#d8a75a"/>
      <text x="578" y="416" fill="#b9cbca">REGRESSION</text><text x="754" y="416" text-anchor="end" fill="#f0c77f">33%</text>
      <rect x="578" y="429" width="176" height="8" rx="4" fill="#17343d"/><rect x="578" y="429" width="58" height="8" rx="4" fill="#86aaa8"/>
      <text x="578" y="478" fill="#b9cbca">NEURAL MODEL</text><text x="754" y="478" text-anchor="end" fill="#f0c77f">25%</text>
      <rect x="578" y="491" width="176" height="8" rx="4" fill="#17343d"/><rect x="578" y="491" width="44" height="8" rx="4" fill="#c98555"/>
    </g>

    <g transform="translate(104 570)">
      <rect width="212" height="154" rx="18" fill="#e6eee9"/>
      <text x="24" y="38" fill="#49646a" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">DATA INPUT</text>
      <text x="24" y="92" fill="#1c3e47" font-family="Georgia, serif" font-size="38">12.4k</text>
      <text x="24" y="120" fill="#78908f" font-family="Arial, sans-serif" font-size="12">normalized records</text>
    </g>
    <g transform="translate(340 570)">
      <rect width="212" height="154" rx="18" fill="#f0e4cf"/>
      <text x="24" y="38" fill="#7b6445" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">RISK SIGNAL</text>
      <text x="24" y="92" fill="#794f35" font-family="Georgia, serif" font-size="38">LOW</text>
      <text x="24" y="120" fill="#947e64" font-family="Arial, sans-serif" font-size="12">within threshold</text>
    </g>
    <g transform="translate(576 570)">
      <rect width="216" height="154" rx="18" fill="#dce8e6"/>
      <text x="24" y="38" fill="#49646a" font-family="Arial, sans-serif" font-size="12" letter-spacing="2">NEXT ACTION</text>
      <path d="M26 82H156" stroke="#1f5963" stroke-width="6" stroke-linecap="round"/>
      <path d="M144 67l22 15-22 15" fill="none" stroke="#1f5963" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="124" fill="#78908f" font-family="Arial, sans-serif" font-size="12">review recommendation</text>
    </g>
  </g>

  <g transform="translate(870 226)">
    <circle cx="120" cy="120" r="116" fill="none" stroke="#789998" stroke-width="2" stroke-dasharray="3 12"/>
    <circle cx="120" cy="120" r="74" fill="#f3e6cc" opacity=".14"/>
    <circle cx="120" cy="120" r="28" fill="url(#gold)"/>
    <g fill="#dbe6e2">
      <circle cx="120" cy="4" r="12"/><circle cx="224" cy="72" r="12"/><circle cx="190" cy="208" r="12"/><circle cx="42" cy="206" r="12"/><circle cx="10" cy="76" r="12"/>
    </g>
    <g stroke="#99b2b0" stroke-width="3" opacity=".7">
      <path d="M120 32v60"/><path d="M198 83l-54 28"/><path d="M174 190l-38-47"/><path d="M58 188l47-48"/><path d="M34 84l60 29"/>
    </g>
  </g>
  <text x="872" y="524" fill="#f7efdf" font-family="Georgia, serif" font-size="34">把模型变成</text>
  <text x="872" y="568" fill="#e2b568" font-family="Georgia, serif" font-size="34">可理解的决策工具</text>
  <text x="874" y="612" fill="#91aaa9" font-family="Arial, sans-serif" font-size="13" letter-spacing="2">CONCEPTUAL VISUAL · NO PROJECT DATA</text>
</svg>
